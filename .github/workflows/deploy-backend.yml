name: Deploy Backend to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          # Exclude everything that should NOT go to Azure
          zip -r deploy.zip . \
            -x "venv/*" ".venv/*" \
            "node_modules/*" "frontend/node_modules/*" \
            ".git/*" ".github/*" \
            "**/__pycache__/*" "**/*.pyc" "**/*.pyo" \
            "frontend/src/*" "frontend/public/*" \
            "docs/*" "tests/*" \
            "stitch_analysis_results_detail_report*" \
            "hf_space/*" \
            "azure_logs*" \
            "*.zip"
          echo "Package size: $(du -sh deploy.zip)"
          echo "Verifying key files:"
          unzip -l deploy.zip | grep -E '(manage.py|requirements.txt|startup.sh|backend/settings|backend/wsgi)'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deploy.zip
