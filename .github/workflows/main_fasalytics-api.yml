name: Build and deploy Python app to Azure Web App - fasalytics-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirement.txt
        # requirement.txt contains only lean Azure packages
        # Heavy ML deps (torch, numpy, transformers) run on HuggingFace Space only

      - name: Verify Django starts
        env:
          SECRET_KEY: ci-test-key-not-production
          DEBUG: "False"
          ALLOWED_HOSTS: "*"
          HF_SPACE_URL: ""
          DJANGO_SETTINGS_MODULE: backend.settings
        run: |
          python -c "
          import os, sys, django
          os.environ['DJANGO_SETTINGS_MODULE'] = 'backend.settings'
          os.environ.setdefault('SECRET_KEY', 'ci-test-key')
          os.environ.setdefault('DEBUG', 'False')
          os.environ.setdefault('ALLOWED_HOSTS', '*')
          django.setup()
          print('Django setup OK')
          from backend.main.views import analyze_crop_api
          print('Views import OK')
          "

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !testenv/**
            !antenv/**
            !.git/**
            !**/__pycache__/**
            !*.pyc

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fasalytics-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

