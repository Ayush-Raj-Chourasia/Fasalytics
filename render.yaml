# render.yaml — Render Blueprint for Fasalytics Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fasalytics-api
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (Supabase connection string)
      - key: ALLOWED_HOSTS
        value: ".onrender.com,fasalytics.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fasalytics.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://fasalytics.vercel.app"
